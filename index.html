<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>
    <!-- Connect CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Connect JavaScript -->
    <script src="script.js" defer></script>
</head>

<body>

    <div class="form-container" style="text-align: center; margin-bottom: 20px;">
        <input id="nameInput" type="text" placeholder="Enter your name">
        <input id="ageInput" type="number" placeholder="Enter your age">
        <button id="submitButton">Submit</button>
    </div>

    <div class="slider">
        <div class="slider-track">
            <div class="slide">
                <img src="img.1.jpg" alt="Image 1">
            </div>
            <div class="slide">
                <img src="img.2.jpg" alt="Image 2">
            </div>
            <div class="slide">
                <img src="img.3.jpg" alt="Image 3">
            </div>
            <div class="slide">
                <img src="img.4.jpg" alt="Image 4">
            </div>
        </div>

        <!-- Navigation buttons -->
        <button class="slider-btn prev">❮</button>
        <button class="slider-btn next">❯</button>
    </div>

    <div id="output" style="text-align: center; margin-top: 15px;"></div>

</body>

</html>
